{% extends 'base.html' %}
{% block title %}Parámetros · Ópticas Casimiro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-7">
    <div class="oc-encabezado">
      <div>
        <h1><i class="bi bi-sliders"></i>Parámetros del sistema</h1>
        <p>Reglas del negocio que se aplican en todas las sucursales.</p>
      </div>
    </div>
    <form method="post" novalidate class="card card-body p-4">
      {% csrf_token %}
      <h2 class="h6 text-muted text-uppercase mb-2">Ventas</h2>
      {% include '_campos.html' %}
      <div class="d-flex gap-2 border-top pt-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        <a class="btn btn-outline-secondary" href="{% url 'inicio' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
