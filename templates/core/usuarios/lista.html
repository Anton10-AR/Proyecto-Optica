{% extends 'base.html' %}
{% block title %}Usuarios · Ópticas Casimiro{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h4 mb-0">Usuarios</h1>
  {% if perms.core.add_usuario %}<a class="btn btn-primary" href="{% url 'usuario_crear' %}">Nuevo usuario</a>{% endif %}
</div>
<form class="row g-2 mb-3" hx-get="{% url 'usuario_lista' %}" hx-target="#tabla-usuarios"
      hx-trigger="input changed delay:300ms from:input[name=q], change from:select" hx-push-url="true">
  <div class="col-md-6">
    <input type="search" name="q" value="{{ q }}" class="form-control" placeholder="Buscar por nombre, CI o usuario" aria-label="Buscar">
  </div>
  <div class="col-6 col-md-3">
    <select name="rol" class="form-select" aria-label="Filtrar por rol">
      <option value="">Todos los roles</option>
      {% for r in roles %}<option value="{{ r.pk }}" {% if rol == r.pk|stringformat:'s' %}selected{% endif %}>{{ r.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-3">
    <select name="estado" class="form-select" aria-label="Filtrar por estado">
      <option value="">Todos los estados</option>
      <option value="activo" {% if estado == 'activo' %}selected{% endif %}>Activos</option>
      <option value="inactivo" {% if estado == 'inactivo' %}selected{% endif %}>Inactivos</option>
    </select>
  </div>
  <noscript><div class="col-12"><button class="btn btn-secondary">Filtrar</button></div></noscript>
</form>
<div id="tabla-usuarios">{% include 'core/usuarios/_tabla.html' %}</div>
{% endblock %}
