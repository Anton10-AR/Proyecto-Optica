{% extends 'base.html' %}
{% block title %}Sucursal · Ópticas Casimiro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h4 mb-3">{% if object %}Editar sucursal: {{ object }}{% else %}Nueva sucursal{% endif %}</h1>
    <form method="post" novalidate class="card card-body shadow-sm">
      {% csrf_token %}
      {% include '_campos.html' %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" href="{% url 'sucursal_lista' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
